.stage{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,calc(100dvh*.565));transform:translateX(-50%);overflow:hidden}
.tw{position:absolute;inset:0;pointer-events:none;background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(3px 3px at 72% 30%,#fff,transparent),radial-gradient(2px 2px at 38% 52%,#fff,transparent),radial-gradient(3px 3px at 88% 62%,#fff,transparent),radial-gradient(2px 2px at 22% 78%,#fff,transparent);animation:tw 2.6s infinite alternate}
@keyframes tw{to{opacity:.15}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 18%;transition:opacity .8s}
#p2{opacity:0;pointer-events:none;justify-content:flex-start;padding:27dvh 13% 3dvh}
.hint{font-size:1.3rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:26px}
.env{width:min(86%,340px);cursor:pointer;background:none;border:0;padding:0;filter:drop-shadow(0 6px 4px rgba(40,22,12,.75)) drop-shadow(0 20px 14px rgba(40,22,12,.7)) drop-shadow(0 38px 28px rgba(40,22,12,.55));animation:fl 2.4s ease-in-out infinite;transition:transform .9s,opacity .9s}
@keyframes fl{50%{transform:translateY(-8px)}}
.env img{width:100%;display:block}
@keyframes pop{40%{transform:scale(1.07) rotate(-2deg)}70%{transform:scale(1.05) rotate(1.5deg)}}
.env.open{animation:pop .6s}
.env.go{transform:scale(2.6);opacity:0}
.big{font:700 min(21vw,11dvh,6.8rem)/.9 'Cormorant Garamond',serif;background:linear-gradient(135deg,#fff6e4,#dcb88e 40%,#fff0d6 58%,#b8895e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #a9825d;letter-spacing:-.04em;filter:drop-shadow(0 0 6px rgba(255,240,215,.9))}
.name{font:min(13.5vw,7.6dvh,4.6rem)/1 'Great Vibes',cursive;margin:-6px 0 min(2.4dvh,1.2rem);color:#8f6a4c}
.l{font-family:'Libre Baskerville',Georgia,serif;text-transform:uppercase;letter-spacing:.24em;font-size:min(4vw,2.3dvh,1rem);color:#7a5a42;margin:min(1.3dvh,.7rem) 0}
.row{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:center;gap:min(3vw,14px);width:min(100%,380px);margin:min(1.2dvh,.6rem) 0}
.side{text-transform:uppercase;border-top:1px solid #a97d55;border-bottom:1px solid #a97d55;padding:.7em 0;width:8.6em;text-align:center;font-family:'Libre Baskerville',Georgia,serif;letter-spacing:.16em;font-size:min(3.6vw,2.1dvh,.95rem);color:#7a5a42}
.four{font:700 min(14vw,7.6dvh,4.2rem)/1 'Playfair Display',Georgia,serif;color:#b98f68}
.btns{display:flex;gap:20px;margin:min(2.6dvh,1.4rem) 0 0}
.btn{width:min(130px,13.5dvh);height:min(130px,13.5dvh);background:none;border:0;padding:0;display:block;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
.btn svg{width:100%;height:100%}
.small{font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em}
.a{opacity:0;transform:translateY(24px) scale(.96)}
.show .a{animation:in 1s forwards}
@keyframes in{to{opacity:1;transform:none}}
